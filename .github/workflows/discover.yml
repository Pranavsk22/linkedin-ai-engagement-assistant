name: Twice-weekly AI post discovery

on:
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC
    - cron: "30 3 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-post-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, score, and upload posts
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_BEARER_TOKEN: ${{ secrets.INGEST_BEARER_TOKEN }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}
        run: python -m discovery.upload
